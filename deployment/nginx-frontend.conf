# ========================================
# CONFIGURACIÓN DE NGINX PARA FRONTEND
# ========================================
# Servidor: 172.19.82.206
# Dominio: geocampus.unap.cl
# ========================================

# Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name geocampus.unap.cl;
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geocampus.unap.cl;
    
    # ===== CONFIGURACIÓN SSL =====
    ssl_certificate /etc/ssl/certs/geocampus.unap.cl.crt;
    ssl_certificate_key /etc/ssl/private/geocampus.unap.cl.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # ===== DIRECTORIO ROOT =====
    # Ubicación del build de producción del frontend
    root /var/www/geocampus/dist;
    index index.html;
    
    # ===== LOGS =====
    access_log /var/log/nginx/geocampus-access.log;
    error_log /var/log/nginx/geocampus-error.log;
    
    # ===== CONFIGURACIÓN PARA SPA (Single Page Application) =====
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # ===== CACHE DE ARCHIVOS ESTÁTICOS =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ===== COMPRESIÓN GZIP =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # ===== SEGURIDAD =====
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
