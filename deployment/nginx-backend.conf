# ========================================
# CONFIGURACIÓN DE NGINX PARA BACKEND API
# ========================================
# Servidor: 172.19.82.205
# Dominio: api-geocampus.unap.cl
# Puerto Backend: 4000
# ========================================

# Bloque upstream para el servidor Node.js
upstream geocampus_backend {
    # Servidor Node.js corriendo en el puerto 4000
    server 127.0.0.1:4000;
    
    # Configuración de keepalive para mejor rendimiento
    keepalive 64;
}

# Redirección HTTP a HTTPS (Recomendado)
server {
    listen 80;
    listen [::]:80;
    server_name api-geocampus.unap.cl;
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-geocampus.unap.cl;
    
    # ===== CONFIGURACIÓN SSL =====
    # IMPORTANTE: Reemplazar con las rutas de tus certificados SSL
    ssl_certificate /etc/ssl/certs/api-geocampus.unap.cl.crt;
    ssl_certificate_key /etc/ssl/private/api-geocampus.unap.cl.key;
    
    # Protocolos y cifrados SSL seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # ===== CONFIGURACIÓN DE LOGS =====
    access_log /var/log/nginx/api-geocampus-access.log;
    error_log /var/log/nginx/api-geocampus-error.log;
    
    # ===== CONFIGURACIÓN DE PROXY =====
    location / {
        # Headers necesarios para proxy inverso
        proxy_pass http://geocampus_backend;
        proxy_http_version 1.1;
        
        # Headers de WebSocket (por si se implementa en el futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Headers estándar de proxy
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Tamaño máximo de carga (para subida de imágenes)
        client_max_body_size 10M;
    }
    
    # ===== COMPRESIÓN GZIP =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # ===== SEGURIDAD =====
    # Ocultar versión de Nginx
    server_tokens off;
    
    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
