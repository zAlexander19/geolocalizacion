server {
    listen 80;
    server_name api-geocampus.unap.cl;

    # Redirigir HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-geocampus.unap.cl;

    # Certificados SSL (Debes generarlos con Certbot/LetsEncrypt)
    # ssl_certificate /etc/letsencrypt/live/api-geocampus.unap.cl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api-geocampus.unap.cl/privkey.pem;

    # Logs
    access_log /var/log/nginx/geocampus-api.access.log;
    error_log /var/log/nginx/geocampus-api.error.log;

    location / {
        proxy_pass http://localhost:3000; # Puerto de tu app Node.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para subida de archivos grandes
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300; 
    }

    # Configuración opcional para subida de archivos
    client_max_body_size 10M;
}